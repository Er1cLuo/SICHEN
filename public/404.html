<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面未找到 · 思晨五金</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0a0a0b;
        color: #f4f4f0;
        font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .code { font-size: clamp(72px, 14vw, 140px); font-weight: 300; letter-spacing: 0.12em; line-height: 1; color: rgba(255,255,255,0.16); }
      h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.3em; }
      p { color: #a2a2a6; font-size: 14px; max-width: 420px; line-height: 2; }
      a {
        display: inline-block;
        margin-top: 10px;
        padding: 13px 30px;
        background: #ffffff;
        color: #0a0a0b;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.2em;
        border-radius: 2px;
      }
      a:hover { background: #d6d6d0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404</div>
      <h1>PAGE NOT FOUND</h1>
      <p>您访问的页面不存在或已被移除，请返回首页继续浏览。</p>
      <a href="/">返回首页</a>
    </div>
  </body>
</html>
